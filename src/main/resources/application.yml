server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: service-merchants
              uri: ${MERCHANTS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/shops/**
            - id: service-accounts
              uri: ${ACCOUNTS_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/accounts/**,/api/v1/cards/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
