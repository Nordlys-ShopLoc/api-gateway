server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: service-merchants
              uri: ${MERCHANTS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/shops/**

management:
  endpoints:
    web:
      exposure:
        include: health,info